# Karpenter GPU NodePool + EC2NodeClass (manual re-apply / repair copy).
#
# This mirrors what the CDK stack creates, with the two air-gapped fixes:
#   * securityGroupSelectorTerms selects the EKS cluster SG by ID (CDK cannot
#     tag the EKS-managed SG, so tag-based discovery matches nothing).
#   * instanceProfile is referenced by NAME (Karpenter cannot create the
#     instance profile at runtime -- an isolated VPC has no IAM VPC endpoint).
#
# Cluster-specific values below are for <CLUSTER_NAME> (account <AWS_ACCOUNT_ID>,
# us-east-1). If you redeploy the stack, CDK regenerates these; this file is a
# manual repair/demo aid.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  instanceProfile: <KARPENTER_NODE_INSTANCE_PROFILE>
  # REQUIRED for GPU images. Without this Karpenter uses the AMI's default root
  # volume (20 GB), and the 3.7 GB PyTorch image fills it -> kubelet evicts pods
  # with "node was low on resource: ephemeral-storage". Found in rehearsal.
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: <CLUSTER_NAME> }
  securityGroupSelectorTerms:
    - id: <CLUSTER_SECURITY_GROUP_ID>
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels: { gpu: "on", role: gpu, pool: karpenter }
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: gpu }
      requirements:
        - { key: node.kubernetes.io/instance-type, operator: In, values: ["g4dn.xlarge"] }
        - { key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"] }
      expireAfter: 168h
  limits:
    # counts HAMi vGPUs (4 per card), NOT physical cards
    nvidia.com/gpu: 16
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
