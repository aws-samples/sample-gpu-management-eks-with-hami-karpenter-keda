# Priority classes for the buffer-pod autoscaling pattern (docs/10).
# Real GPU workloads (gpu-workload) preempt low-priority buffer pods
# (gpu-buffer), which then go Pending and make Karpenter add a node.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: gpu-buffer
value: -10                     # LOW -> always preemptible
globalDefault: false
description: "Placeholder pods that hold spare vGPU capacity; preempted by real GPU work."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: gpu-workload
value: 1000                    # HIGH -> preempts gpu-buffer for instant placement
globalDefault: false
description: "Real GPU workloads; preempt buffer pods."
